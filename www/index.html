<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FerroWill Importaciones</title>
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg: #030303;
            --surface: #0f0f0f;
            --surface-light: #161616;
            --border: #262626;
            --border-light: rgba(211, 47, 47, 0.15);
            --text: #eaeaea;
            --text-secondary: #8a8a8a;
            --accent: #d32f2f;
            --accent-hover: #b71c1c;
            --accent-dark: #7f0000;
            --accent-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1f0505 0%, #030303 60%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: 80px;
            line-height: 1.6;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
        }

        .app-header {
            padding: 24px 0 20px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: #fff;
            box-shadow: var(--accent-shadow);
        }
        .brand-text h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #ffffff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }
        .brand-text span {
            font-size: 0.65rem;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .panel {
            display: none;
            animation: fadeSlide 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .panel.active {
            display: block;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: linear-gradient(145deg, #111111, #0a0a0a);
            border: 1px solid var(--border);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 2px solid transparent;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: var(--transition);
        }
        .card:hover {
            border-left-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .badge {
            background: rgba(211, 47, 47, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .input-field {
            width: 100%;
            background: #080808;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            color: var(--text);
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            transition: var(--transition);
            -webkit-user-select: text;
            user-select: text;
        }
        .input-field:focus {
            border-color: var(--accent);
            background: #0c0c0c;
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.15);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            box-shadow: var(--accent-shadow);
        }
        .btn:active:not(:disabled) {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(211, 47, 47, 0.3);
        }
        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            background: #333;
            box-shadow: none;
            border-color: #444;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            box-shadow: none;
        }
        .btn-outline:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 0.75rem;
            width: auto;
        }
        .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: #080808;
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-icon:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(211, 47, 47, 0.1);
        }

        .product-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: var(--surface-light);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-left: 3px solid transparent;
            transition: var(--transition);
            cursor: pointer;
        }
        .product-item:hover {
            border-left-color: var(--accent);
            background: #1c1c1c;
        }
        .product-thumb {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            background: #050505;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
            overflow: hidden;
        }
        .product-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            flex: 1;
            min-width: 0;
        }
        .product-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 14px;
            margin-top: 4px;
            font-weight: 500;
        }
        .stock-low {
            color: var(--accent);
            font-weight: 700;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.9rem;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .cart-item button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 6px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        .cart-item button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: linear-gradient(180deg, #161616, #0a0a0a);
            border: 1px solid var(--border);
            border-top: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 14px;
            text-align: center;
            transition: var(--transition);
        }
        .summary-card:hover {
            border-top-color: var(--accent);
        }
        .summary-value {
            font-family: 'Cinzel', serif;
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
            margin-top: 4px;
        }
        .summary-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(8, 8, 8, 0.85);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
            z-index: 20;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.6);
        }
        .nav-item {
            color: #666;
            font-size: 0.65rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-item .nav-icon {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }
        .nav-item.active {
            color: var(--accent);
            text-shadow: 0 0 12px rgba(211, 47, 47, 0.5);
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            border: 1px solid var(--accent);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 99;
            white-space: nowrap;
            box-shadow: var(--accent-shadow);
            animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes slideUp {
            from { bottom: 80px; opacity: 0; }
            to { bottom: 100px; opacity: 1; }
        }

        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">FW</div>
                <div class="brand-text">
                    <h1>FerroWill</h1>
                    <span>Agro Importaciones</span>
                </div>
            </div>
        </header>

        <!-- Panel Inventario -->
        <div id="panel-inventario" class="panel active">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Inventario</span>
                    <button class="btn btn-sm" id="btnNuevoProducto">+ Nuevo</button>
                </div>
                <div id="listaProductos"></div>
            </div>
        </div>

        <!-- Panel Nueva Venta -->
        <div id="panel-venta" class="panel">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Nueva Venta</span>
                    <span class="badge" id="badgeCliente">Consumidor Final</span>
                </div>
                <div class="input-group">
                    <label>Razón Social (A nombre de quién va la factura)</label>
                    <input class="input-field" id="inputCliente" placeholder="Ej: Agropecuaria El Torito S.A.">
                </div>
                <div class="input-group">
                    <label>Carnet / NIT</label>
                    <input class="input-field" type="number" id="inputClienteCi" placeholder="Ej: 8492031 o NIT" style="font-size: 1.1rem; letter-spacing: 1px;">
                </div>
                <!-- NUEVO CAMPO AÑADIDO A CONTINUACIÓN -->
                <div class="input-group">
                    <label>Persona que retira / Contacto (Opcional)</label>
                    <input class="input-field" id="inputContacto" placeholder="Ej: Juan Pérez (Chofer)">
                </div>
                <div id="carritoContainer"></div>
                <button class="btn btn-outline" id="btnAgregarProducto" style="margin-top: 10px;">+ Añadir equipo</button>
                <div style="margin-top:20px; font-family:'Cinzel', serif; font-weight:700; font-size:1.3rem; text-align:right; color: #fff;">
                    Total: <span style="color:var(--accent);">Bs <span id="totalVenta">0.00</span></span>
                </div>
                <button class="btn" style="margin-top:16px;" id="btnFinalizarVenta">Procesar Venta</button>
            </div>
        </div>

        <!-- Panel Historial -->
        <div id="panel-historial" class="panel">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Registro de Ventas</span>
                </div>
                <div id="listaVentas"></div>
            </div>
        </div>

        <!-- Panel Resumen -->
        <div id="panel-resumen" class="panel">
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-label">Ventas Hoy</div>
                    <div class="summary-value" id="resumenHoy">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Ingreso Hoy</div>
                    <div class="summary-value" id="gananciaHoy">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Ventas Sem.</div>
                    <div class="summary-value" id="resumenSemana">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Ingreso Sem.</div>
                    <div class="summary-value" id="gananciaSemana">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Ventas Mes</div>
                    <div class="summary-value" id="resumenMes">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Ingreso Mes</div>
                    <div class="summary-value" id="gananciaMes">0</div>
                </div>
            </div>
            <button class="btn btn-outline" id="btnSincronizar">Sincronizar Sistema</button>
            <p style="font-size:0.7rem; color:var(--text-secondary); margin-top:12px; text-align:center; font-weight: 500;">
                ÚLTIMA SINCRONIZACIÓN: <span id="ultimaSync" style="color:#fff;">NUNCA</span>
            </p>
        </div>
    </div>

    <!-- Navegacion inferior -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-panel="panel-inventario">
            <span class="nav-icon">&#9632;</span> Equipos
        </div>
        <div class="nav-item" data-panel="panel-venta">
            <span class="nav-icon">&#9733;</span> Vender
        </div>
        <div class="nav-item" data-panel="panel-historial">
            <span class="nav-icon">&#9776;</span> Registros
        </div>
        <div class="nav-item" data-panel="panel-resumen">
            <span class="nav-icon">&#9779;</span> Balance
        </div>
    </nav>

    <div id="toast" class="toast" style="display:none;"></div>

    <script>
    (function() {
        // ========== CONFIGURACIÓN ADMIN ==========
        const ADMIN_PASSWORD = "Urkupiña3009#";

        // ========== BASE DE DATOS LOCAL (Dexie) ==========
        const db = new Dexie('FerroWillDB');
        // SUBIMOS A VERSIÓN 2 PARA AÑADIR 'contacto' EN LA TABLA VENTAS
        db.version(2).stores({
            productos: 'id, nombre, descripcion, imagen_url, costo, precio_venta, stock, creado_en, actualizado_en',
            ventas: 'id, fecha, cliente, cliente_ci, contacto, metodo_pago, total, creado_en',
            ventas_detalle: 'id, venta_id, producto_id, cantidad, precio_unitario, costo_unitario, subtotal, creado_en'
        });

        // ========== SUPABASE CLIENT ==========
        const SUPABASE_URL = 'https://cjcpsgfuqifyudtqvggo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqY3BzZ2Z1cWlmeXVkdHF2Z2dvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMTYyNDEsImV4cCI6MjA5NDc5MjI0MX0.EoJeeiunzY0aisKLyBHalpYzSoXG4TEJeYEFBitAzgM';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ========== ESTADO ==========
        let carrito = [];
        let totalCarrito = 0;

        // ========== ELEMENTOS DOM ==========
        const paneles = {
            inventario: document.getElementById('panel-inventario'),
            venta: document.getElementById('panel-venta'),
            historial: document.getElementById('panel-historial'),
            resumen: document.getElementById('panel-resumen')
        };
        const navItems = document.querySelectorAll('.nav-item');

        // ========== NAVEGACION ==========
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const panelId = item.dataset.panel;
                Object.values(paneles).forEach(p => p.classList.remove('active'));
                document.getElementById(panelId).classList.add('active');
                navItems.forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                if (panelId === 'panel-inventario') cargarInventario();
                if (panelId === 'panel-historial') cargarHistorial();
                if (panelId === 'panel-resumen') cargarResumen();
                if (panelId === 'panel-venta') renderizarCarrito();
            });
        });

        // ========== TOAST ==========
        function toast(mensaje) {
            const el = document.getElementById('toast');
            el.textContent = mensaje;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        // ========== MODAL DE CONTRASEÑA ADMIN ==========
        function pedirPasswordAdmin(callbackExito) {
            const modalPass = document.createElement('div');
            modalPass.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:110;display:flex;align-items:center;justify-content:center;padding:16px;';
            modalPass.innerHTML = `
                <div style="background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:var(--radius);padding:24px;width:100%;max-width:340px;box-shadow:0 15px 35px rgba(0,0,0,0.8);">
                    <h3 style="margin-bottom:8px;font-family:'Cinzel', serif;color:#fff;font-size:1.1rem;">Restringido</h3>
                    <p style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:16px;">Ingrese la contraseña de Administrador para continuar.</p>
                    <div class="input-group">
                        <label>Contraseña</label>
                        <input class="input-field" type="password" id="inputAdminPass" placeholder="••••••••••••" autofocus>
                    </div>
                    <div style="display:flex;gap:12px;margin-top:20px;">
                        <button class="btn btn-outline" id="btnCancelPass">Cancelar</button>
                        <button class="btn" id="btnConfirmPass">Autorizar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalPass);

            const inputPass = document.getElementById('inputAdminPass');
            inputPass.focus();

            const cerrarModal = () => modalPass.remove();

            document.getElementById('btnCancelPass').addEventListener('click', cerrarModal);
            document.getElementById('btnConfirmPass').addEventListener('click', () => {
                if (inputPass.value === ADMIN_PASSWORD) {
                    cerrarModal();
                    callbackExito();
                } else {
                    toast('Contraseña incorrecta ❌');
                }
            });
            inputPass.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    if (inputPass.value === ADMIN_PASSWORD) {
                        cerrarModal();
                        callbackExito();
                    } else {
                        toast('Contraseña incorrecta ❌');
                    }
                }
            });
        }

        // ========== INVENTARIO ==========
        async function cargarInventario() {
            const productos = await db.productos.toArray();
            const container = document.getElementById('listaProductos');
            if (productos.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary); text-align:center; padding:30px 10px; font-weight:500;">No hay equipos registrados.</p>';
                return;
            }
            container.innerHTML = productos.map(p => `
                <div class="product-item" data-id="${p.id}">
                    <div class="product-thumb">
                        ${p.imagen_url ? `<img src="${p.imagen_url}" alt="${p.nombre}">` : 'FW'}
                    </div>
                    <div class="product-info">
                        <div class="product-name">${p.nombre}</div>
                        <div class="product-meta">
                            <span>Stock: <span class="${p.stock < 5 ? 'stock-low' : ''}">${p.stock}</span></span>
                            <span>Costo: ${p.costo}</span>
                            <span>Venta: ${p.precio_venta}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.product-item').forEach(item => {
                item.addEventListener('click', () => {
                    pedirPasswordAdmin(() => {
                        editarProducto(item.dataset.id);
                    });
                });
            });
        }

        async function abrirFormularioProducto(id = null) {
            const existe = id ? true : false;
            let producto = null;

            if (existe) {
                producto = await db.productos.get(id);
            }

            const modal = document.createElement('div');
            modal.id = 'modalProducto';
            modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;';
            modal.innerHTML = `
                <div style="background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:var(--radius);padding:24px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;box-shadow:0 15px 35px rgba(0,0,0,0.8);">
                    <h3 style="margin-bottom:20px;font-family:'Cinzel', serif;font-weight:700;color:#fff;">${existe ? 'Editar Equipo' : 'Nuevo Equipo'}</h3>
                    <div class="input-group"><label>Nombre del Equipo</label><input class="input-field" id="prodNombre" value="${producto?.nombre || ''}"></div>
                    <div class="input-group"><label>Especificaciones</label><input class="input-field" id="prodDesc" value="${producto?.descripcion || ''}"></div>
                    <div class="input-group"><label>Costo (Bs)</label><input class="input-field" type="number" step="0.01" id="prodCosto" value="${producto?.costo || ''}"></div>
                    <div class="input-group"><label>Precio Venta (Bs)</label><input class="input-field" type="number" step="0.01" id="prodPrecio" value="${producto?.precio_venta || ''}"></div>
                    <div class="input-group"><label>Stock Disponible</label><input class="input-field" type="number" id="prodStock" value="${producto?.stock || 0}"></div>
                    <div class="input-group"><label>Fotografía</label><input class="input-field" type="file" accept="image/*" id="prodImagen" style="padding:10px;"></div>
                    <div style="display:flex;gap:12px;margin-top:24px;">
                        <button class="btn btn-outline" id="btnCancelarModal">Cancelar</button>
                        <button class="btn" id="btnGuardarProducto">Guardar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btnCancelarModal').addEventListener('click', () => modal.remove());
            document.getElementById('btnGuardarProducto').addEventListener('click', () => guardarProducto(id, modal));
        }

        async function guardarProducto(id, modal) {
            const nombre = document.getElementById('prodNombre').value.trim();
            const descripcion = document.getElementById('prodDesc').value.trim();
            const costo = parseFloat(document.getElementById('prodCosto').value);
            const precio_venta = parseFloat(document.getElementById('prodPrecio').value);
            const stock = parseInt(document.getElementById('prodStock').value);
            const file = document.getElementById('prodImagen').files[0];

            if (!nombre || isNaN(costo) || isNaN(precio_venta) || isNaN(stock)) {
                toast('Complete todos los campos correctamente.');
                return;
            }

            const btnGuardar = document.getElementById('btnGuardarProducto');
            const btnCancelar = document.getElementById('btnCancelarModal');
            const textoOriginal = btnGuardar.textContent;
            
            btnGuardar.textContent = 'Guardando... ⏳';
            btnGuardar.disabled = true;
            btnCancelar.disabled = true;

            try {
                let imagen_url = '';
                if (id) {
                    const prod = await db.productos.get(id);
                    imagen_url = prod?.imagen_url || '';
                }
                
                if (file) {
                    const fileName = `producto_${Date.now()}.${file.name.split('.').pop()}`;
                    const { data, error } = await supabaseClient.storage.from('imagenes-productos').upload(fileName, file);
                    
                    if (error) {
                        throw new Error('Error al subir imagen: ' + error.message);
                    }
                    imagen_url = `${SUPABASE_URL}/storage/v1/object/public/imagenes-productos/${fileName}`;
                }

                const datos = {
                    nombre, descripcion, costo, precio_venta, stock,
                    imagen_url,
                    actualizado_en: new Date().toISOString()
                };

                if (id) {
                    await db.productos.update(id, datos);
                } else {
                    await db.productos.add({ ...datos, id: crypto.randomUUID(), creado_en: new Date().toISOString() });
                }
                
                modal.remove();
                cargarInventario();
                toast('Equipo guardado con éxito. ✅');
                
            } catch (error) {
                console.error("Error en guardarProducto:", error);
                toast(error.message || 'Ocurrió un error inesperado al guardar.');
                
                btnGuardar.textContent = textoOriginal;
                btnGuardar.disabled = false;
                btnCancelar.disabled = false;
            }
        }

        function editarProducto(id) {
            abrirFormularioProducto(id);
        }

        document.getElementById('btnNuevoProducto').addEventListener('click', () => {
            pedirPasswordAdmin(() => {
                abrirFormularioProducto();
            });
        });

        // ========== VENTAS ==========
        async function agregarProductoAVenta() {
            const productos = await db.productos.toArray();
            if (productos.length === 0) {
                toast('Inventario vacío.');
                return;
            }
            const modal = document.createElement('div');
            modal.id = 'modalAgregarVenta';
            modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;';
            modal.innerHTML = `
                <div style="background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:var(--radius);padding:24px;width:100%;max-width:400px;box-shadow:0 15px 35px rgba(0,0,0,0.8);">
                    <h3 style="margin-bottom:20px;font-family:'Cinzel', serif;color:#fff;">Añadir al registro</h3>
                    <select class="input-field" id="selectProducto" style="padding:14px;">
                        ${productos.map(p => `<option value="${p.id}">${p.nombre} (Stock: ${p.stock})</option>`).join('')}
                    </select>
                    <div class="input-group" style="margin-top:16px;"><label>Cantidad Unidades</label><input class="input-field" type="number" id="cantidadVenta" value="1" min="1"></div>
                    <div style="display:flex;gap:12px;margin-top:24px;">
                        <button class="btn btn-outline" id="btnCancelarAgregar">Cancelar</button>
                        <button class="btn" id="btnConfirmarAgregar">Añadir</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('btnCancelarAgregar').addEventListener('click', () => modal.remove());
            document.getElementById('btnConfirmarAgregar').addEventListener('click', () => confirmarAgregarAlCarrito(modal));
        }

        async function confirmarAgregarAlCarrito(modal) {
            const productoId = document.getElementById('selectProducto').value;
            const cantidad = parseInt(document.getElementById('cantidadVenta').value);
            if (!productoId || isNaN(cantidad) || cantidad <= 0) {
                toast('Datos inválidos.');
                return;
            }
            const producto = await db.productos.get(productoId);
            if (!producto) return;
            if (cantidad > producto.stock) {
                toast('Stock insuficiente para la operación.');
                return;
            }
            const existente = carrito.find(item => item.producto_id === productoId);
            if (existente) {
                if (existente.cantidad + cantidad > producto.stock) {
                    toast('Stock insuficiente.');
                    return;
                }
                existente.cantidad += cantidad;
            } else {
                carrito.push({
                    producto_id: producto.id,
                    nombre: producto.nombre,
                    precio_venta: producto.precio_venta,
                    cantidad: cantidad
                });
            }
            modal.remove();
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const container = document.getElementById('carritoContainer');
            const totalEl = document.getElementById('totalVenta');
            if (carrito.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary); padding: 10px 0;">No hay equipos en la lista.</p>';
                totalEl.textContent = '0.00';
                totalCarrito = 0;
                return;
            }
            let total = 0;
            container.innerHTML = carrito.map((item, idx) => {
                const subtotal = item.cantidad * item.precio_venta;
                total += subtotal;
                return `
                    <div class="cart-item">
                        <span style="font-weight:500; color:#fff;">${item.nombre} <span style="color:var(--text-secondary);">x${item.cantidad}</span></span>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <span style="font-weight:600;">Bs ${subtotal.toFixed(2)}</span>
                            <button class="btn-icon" style="width:28px;height:28px;font-size:14px;" data-idx="${idx}">&#10005;</button>
                        </div>
                    </div>
                `;
            }).join('');
            totalEl.textContent = total.toFixed(2);
            totalCarrito = total;

            document.querySelectorAll('.cart-item .btn-icon').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.currentTarget.dataset.idx);
                    carrito.splice(idx, 1);
                    renderizarCarrito();
                });
            });
        }

        async function finalizarVenta() {
            if (carrito.length === 0) {
                toast('Agregue equipos para procesar.');
                return;
            }
            const cliente = document.getElementById('inputCliente').value.trim() || 'Consumidor Final';
            const clienteCi = document.getElementById('inputClienteCi').value.trim();
            // CAPTURA DEL NUEVO CAMPO DE CONTACTO
            const contacto = document.getElementById('inputContacto').value.trim() || '';

            if (!clienteCi) {
                toast('Debe ingresar el carnet o NIT del cliente. ⚠️');
                document.getElementById('inputClienteCi').focus();
                return;
            }

            const ventaId = crypto.randomUUID();
            const fecha = new Date().toISOString();

            for (let item of carrito) {
                const prod = await db.productos.get(item.producto_id);
                if (!prod || prod.stock < item.cantidad) {
                    toast(`Stock insuficiente de ${item.nombre}.`);
                    return;
                }
            }

            await db.transaction('rw', db.productos, db.ventas, db.ventas_detalle, async () => {
                for (let item of carrito) {
                    const prod = await db.productos.get(item.producto_id);
                    await db.productos.update(item.producto_id, { stock: prod.stock - item.cantidad });
                    
                    await db.ventas_detalle.add({
                        id: crypto.randomUUID(),
                        venta_id: ventaId,
                        producto_id: item.producto_id,
                        cantidad: item.cantidad,
                        precio_unitario: item.precio_venta,
                        costo_unitario: prod.costo, 
                        subtotal: item.cantidad * item.precio_venta, 
                        creado_en: fecha
                    });
                }
                await db.ventas.add({
                    id: ventaId,
                    fecha,
                    cliente,
                    cliente_ci: clienteCi,
                    contacto: contacto, // GUARDAR EL CONTACTO
                    metodo_pago: 'Efectivo',
                    total: totalCarrito,
                    creado_en: fecha
                });
            });

            carrito = [];
            totalCarrito = 0;
            document.getElementById('inputCliente').value = '';
            document.getElementById('inputClienteCi').value = '';
            document.getElementById('inputContacto').value = ''; // LIMPIAR EL INPUT
            document.getElementById('badgeCliente').textContent = 'Consumidor Final';
            renderizarCarrito();
            toast('Operación registrada exitosamente.');
            cargarInventario();
            sincronizar();
        }

        document.getElementById('btnAgregarProducto').addEventListener('click', agregarProductoAVenta);
        document.getElementById('btnFinalizarVenta').addEventListener('click', finalizarVenta);
        document.getElementById('inputCliente').addEventListener('input', (e) => {
            document.getElementById('badgeCliente').textContent = e.target.value.trim() || 'Consumidor Final';
        });

        // ========== HISTORIAL ==========
        async function cargarHistorial() {
            const ventas = await db.ventas.orderBy('fecha').reverse().toArray();
            const container = document.getElementById('listaVentas');
            if (ventas.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary); text-align:center; padding: 20px;">Sin registros operativos.</p>';
                return;
            }
            container.innerHTML = ventas.map(v => {
                // LÓGICA PARA MOSTRAR EL CONTACTO SI EXISTE
                const contactoTexto = v.contacto ? `<br><span style="color:#a8a8a8;">Retiró: ${v.contacto}</span>` : '';
                
                return `
                <div class="card" style="cursor:pointer; padding:16px;" data-venta-id="${v.id}">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:700; color:#fff;">${v.cliente}</div>
                            <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:2px;">
                                CI/NIT: ${v.cliente_ci || 'S/N'} • ${new Date(v.fecha).toLocaleDateString()}
                                ${contactoTexto}
                            </div>
                        </div>
                        <span style="font-family:'Cinzel', serif; font-weight:700; color:var(--accent);">Bs ${v.total.toFixed(2)}</span>
                    </div>
                    <div class="detalle-venta" id="detalle-${v.id}" style="display:none; margin-top:12px; border-top:1px dashed var(--border); padding-top:12px;"></div>
                </div>
                `;
            }).join('');

            document.querySelectorAll('[data-venta-id]').forEach(card => {
                card.addEventListener('click', async () => {
                    const ventaId = card.dataset.ventaId;
                    const detalleDiv = document.getElementById(`detalle-${ventaId}`);
                    if (detalleDiv.style.display === 'block') {
                        detalleDiv.style.display = 'none';
                        return;
                    }
                    const detalles = await db.ventas_detalle.where('venta_id').equals(ventaId).toArray();
                    let html = '';
                    for (let d of detalles) {
                        const prod = await db.productos.get(d.producto_id);
                        const sub = d.subtotal || (d.cantidad * d.precio_unitario) || 0; 
                        html += `<div style="display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:6px; color:#ddd;">
                                    <span>${prod?.nombre || 'Equipo Eliminado'} <span style="color:#888;">(x${d.cantidad})</span></span>
                                    <span>Bs ${sub.toFixed(2)}</span>
                                 </div>`;
                    }
                    detalleDiv.innerHTML = html;
                    detalleDiv.style.display = 'block';
                });
            });
        }

        // ========== RESUMEN ==========
        async function cargarResumen() {
            const ahora = new Date();
            const inicioHoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate()).toISOString();
            const inicioSemana = new Date(ahora.setDate(ahora.getDate() - ahora.getDay())).toISOString();
            const inicioMes = new Date(ahora.getFullYear(), ahora.getMonth(), 1).toISOString();

            const todasVentas = await db.ventas.toArray();
            const filtrar = desde => todasVentas.filter(v => v.fecha >= desde);

            const calcGanancia = async (ventasFiltradas) => {
                let ganancia = 0;
                for (let v of ventasFiltradas) {
                    const detalles = await db.ventas_detalle.where('venta_id').equals(v.id).toArray();
                    for (let d of detalles) {
                        const prod = await db.productos.get(d.producto_id);
                        if (prod) {
                             const sub = d.subtotal || (d.cantidad * d.precio_unitario);
                             const costoU = d.costo_unitario || prod.costo;
                             ganancia += sub - (costoU * d.cantidad);
                        }
                    }
                }
                return ganancia;
            };

            const formatCurrency = (val) => {
                if (val >= 1000) return (val / 1000).toFixed(1) + 'k';
                return val.toFixed(0);
            };

            const hoyVentas = filtrar(inicioHoy);
            const semVentas = filtrar(inicioSemana);
            const mesVentas = filtrar(inicioMes);

            document.getElementById('resumenHoy').textContent = hoyVentas.length;
            document.getElementById('gananciaHoy').textContent = `${formatCurrency(await calcGanancia(hoyVentas))}`;
            document.getElementById('resumenSemana').textContent = semVentas.length;
            document.getElementById('gananciaSemana').textContent = `${formatCurrency(await calcGanancia(semVentas))}`;
            document.getElementById('resumenMes').textContent = mesVentas.length;
            document.getElementById('gananciaMes').textContent = `${formatCurrency(await calcGanancia(mesVentas))}`;
        }

        // ========== SINCRONIZACION ==========
        async function sincronizar() {
            try {
                const btnSync = document.getElementById('btnSincronizar');
                btnSync.textContent = "Sincronizando...";
                btnSync.style.opacity = "0.7";
                
                const productos = await db.productos.toArray();
                for (let p of productos) {
                    await supabaseClient.from('productos').upsert({
                        id: p.id, nombre: p.nombre, descripcion: p.descripcion,
                        imagen_url: p.imagen_url, costo: p.costo, precio_venta: p.precio_venta,
                        stock: p.stock, creado_en: p.creado_en, actualizado_en: p.actualizado_en
                    });
                }
                const ventas = await db.ventas.toArray();
                for (let v of ventas) {
                    // SE AGREGA LA VARIABLE 'contacto' EN LA SINCRONIZACIÓN A SUPABASE
                    await supabaseClient.from('ventas').upsert({
                        id: v.id, fecha: v.fecha, cliente: v.cliente, cliente_ci: v.cliente_ci,
                        contacto: v.contacto, metodo_pago: v.metodo_pago, total: v.total, creado_en: v.creado_en
                    });
                    const detalles = await db.ventas_detalle.where('venta_id').equals(v.id).toArray();
                    for (let d of detalles) {
                        await supabaseClient.from('ventas_detalle').upsert({
                            id: d.id, 
                            venta_id: d.venta_id, 
                            producto_id: d.producto_id,
                            cantidad: d.cantidad, 
                            precio_unitario: d.precio_unitario, 
                            costo_unitario: d.costo_unitario || 0,
                            subtotal: d.subtotal || (d.cantidad * d.precio_unitario),
                            creado_en: d.creado_en
                        });
                    }
                }
                
                const now = new Date();
                document.getElementById('ultimaSync').textContent = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
                btnSync.textContent = "Sincronizar Sistema";
                btnSync.style.opacity = "1";
                toast('Sistema sincronizado correctamente.');
            } catch (e) {
                document.getElementById('btnSincronizar').textContent = "Sincronizar Sistema";
                document.getElementById('btnSincronizar').style.opacity = "1";
                toast('Fallo al sincronizar base de datos.');
                console.error(e);
            }
        }

        document.getElementById('btnSincronizar').addEventListener('click', sincronizar);
        window.addEventListener('online', sincronizar);
        
        // ========== DESCARGAR DE SUPABASE AL INICIAR ==========
        async function descargarDatosDeSupabase() {
            try {
                const { data: productosNube, error: errProd } = await supabaseClient.from('productos').select('*');
                if (errProd) throw errProd;
                if (productosNube && productosNube.length > 0) {
                    await db.productos.bulkPut(productosNube);
                }

                const { data: ventasNube, error: errVent } = await supabaseClient.from('ventas').select('*');
                if (errVent) throw errVent;
                if (ventasNube && ventasNube.length > 0) {
                    await db.ventas.bulkPut(ventasNube);
                }

                const { data: detallesNube, error: errDet } = await supabaseClient.from('ventas_detalle').select('*');
                if (errDet) throw errDet;
                if (detallesNube && detallesNube.length > 0) {
                    await db.ventas_detalle.bulkPut(detallesNube);
                }

                cargarInventario();
                if (typeof cargarHistorial === "function") cargarHistorial();
                if (typeof cargarResumen === "function") cargarResumen();
                
            } catch (e) {
                console.error("Error al descargar de Supabase:", e);
            }
        }

        // ========== INICIO ==========
        cargarInventario();
        descargarDatosDeSupabase();
    })();
    </script>
</body>
